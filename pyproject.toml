[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auditgym"
version = "1.0.0"
description = "Reproducible RL environment for an AI financial auditor (stdlib only)."
readme = "README.md"
license = { text = "MIT" }
requires-python = "==3.11.*"
dependencies = []

[tool.setuptools.packages.find]
include = ["auditgym*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Optional lint config (ruff is not a dependency and CI does not run it; `ruff check .` works if you have it).
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".scratch", "episodes", "grader_data", "trajectories"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E701", "E702", "E731", "E741", "B008"]
