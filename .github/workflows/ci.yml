name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # network is needed only for this install; `check` itself is offline
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m auditgym check --quick --out reports
      - name: Upload the check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-report
          path: reports/check_report.*

  isolation-docker:
    # the job above runs unprivileged, so the uid-sandbox tests skip there; this one runs them as root in the image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t auditgym .
      - run: scripts/docker_isolation_check.sh auditgym
